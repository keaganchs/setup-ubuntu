# Set prefix key to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Vim-like pane navigation, on Alt rather than Ctrl. Ctrl-h is the same byte
# (0x08) a terminal sends for Ctrl-Backspace, so binding it here would eat every
# Ctrl-Backspace in every pane; gnome-terminal can't tell the two apart, even
# with extended keys enabled. Ctrl-h is left alone so it reaches the shell and
# deletes a word (bash/inputrc, and lua/user/... for nvim's insert mode).
#
# vim-tmux-navigator re-binds these when tpm loads it, so the keys have to be
# given to the plugin as options rather than bound here: it passes them through
# to vim when the pane is running vim, and moves the tmux pane otherwise.
set -g @vim_navigator_mapping_left 'M-h'
set -g @vim_navigator_mapping_down 'M-j'
set -g @vim_navigator_mapping_up 'M-k'
set -g @vim_navigator_mapping_right 'M-l'

# Open new panes in the directory of the pane being split. Without -c a split
# inherits the directory the terminal that attached the client was started in,
# which is rarely where you are by the time you split.
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Re-read this file into the running server. Worth a binding because the server
# is a daemon that outlives every terminal window: closing and reopening the
# terminal only replaces the client, so config changes are not picked up until
# something sources the file (or the server is killed, taking sessions with it).
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
# Mouse drags go to the CLIPBOARD selection, not tmux-yank's default of
# PRIMARY. PRIMARY is the middle-click one: a selection left only there can't
# be pasted with Ctrl-V, which is what makes copying out of tmux look broken.
# Read when the plugin loads, so it has to be set before tpm runs below.
set -g @yank_selection_mouse 'clipboard'
# Save the session layout with prefix + C-s and bring it back with prefix + C-r,
# so a reboot (or a killed server) doesn't cost the window/pane arrangement.
# Saves are manual and land in ~/.local/share/tmux/resurrect; nothing here writes
# to that directory at install time, so re-running install.sh can't lose one.
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Save what's on screen too, so a restored pane comes back with its scrollback
# rather than empty. The contents go in a pane_contents.tar.gz next to the save
# and are capped by history-limit, which is set to 500 lines after tpm below.
set -g @resurrect-capture-pane-contents 'on'
set -g mouse on

# Flag a background window that has produced output since you last looked at
# it; restyle_status.sh is what turns that flag into the "updated" accent on
# its status bar tab. visual-activity stays off so the flag is the only signal
# -- no message stealing the status line.
set -g monitor-activity on
set -g visual-activity off

# Square left cap on the right-aligned status segments. The theme applies this
# to all of them; restyle_status.sh curves just the leftmost one back, and
# recolours the bar to match the terminal background.
# (An empty value here would fall through to the theme's rounded default.)
set -g @catppuccin_right_separator "█"

# set vi-mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# `y` is left to tmux-yank, which binds it after this file is read (it loads
# from tpm at the bottom) and pipes the selection to xclip. Binding
# copy-selection-and-cancel here would be dead config: it only reaches tmux's
# own paste buffer, and the plugin overwrites the binding anyway.

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Window switching: prefix + p / prefix + n (tmux's own defaults, spelled out
# here because they used to be M-h / M-l, which the pane navigation now uses).
bind-key p previous-window
bind-key n next-window

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# Custom status bar segments (must come after tpm so they aren't overwritten
# by the catppuccin theme's own status-left/status-right).
run-shell '~/.config/tmux/scripts/restyle_status.sh'

# tmux-resurrect's save, but refused for the first 10s after the server starts
# (see the script). Bound after tpm so it replaces the plugin's own C-s.
bind C-s run-shell '~/.config/tmux/scripts/resurrect_save.sh'
set -ag status-right "#(~/.config/tmux/scripts/git_branch.sh #{pane_current_path})#(~/.config/tmux/scripts/claude_usage.sh)"
set -g status-interval 30

# Scrollback: 500 lines per pane. Set after tpm because tmux-sensible raises it
# to 50000, and that many lines per pane is a lot to write into every resurrect
# save. tmux fixes a pane's limit when the pane is created, so this applies to
# new panes -- existing ones keep the limit they were born with.
set -g history-limit 500

# Clearing the screen clears the scrollback with it, so what was cleared is
# really gone and doesn't come back through a restore. `clear` in bash does the
# same (see bash/functions.sh); this is the Ctrl-l path, which readline handles
# on its own without running any command.
bind -n C-l send-keys C-l \; clear-history
